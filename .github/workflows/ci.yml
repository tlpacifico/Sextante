name: CI

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    name: Build (.NET + Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/Web/Sextante.Web/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Angular dependencies
        working-directory: src/Web/Sextante.Web
        run: npm ci --no-audit --no-fund

      - name: Restore .NET solution
        run: dotnet restore Sextante.slnx

      - name: Build Release (runs ng build via MSBuild target)
        run: dotnet build Sextante.slnx -c Release --no-restore

      - name: Upload published artifact (Host)
        uses: actions/upload-artifact@v4
        with:
          name: host-build
          path: |
            src/Bootstrap/Sextante.Host/bin/Release/net10.0/
            src/Bootstrap/Sextante.Host/wwwroot/
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Test (xUnit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/Web/Sextante.Web/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET solution
        run: dotnet restore Sextante.slnx

      - name: Build Release (skip Angular - tests do not need it)
        run: dotnet build Sextante.slnx -c Release --no-restore -p:SkipAngularBuild=true

      - name: Test
        run: dotnet test Sextante.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Install Angular dependencies
        working-directory: src/Web/Sextante.Web
        run: npm ci --no-audit --no-fund

      - name: Karma unit tests (ChromeHeadless)
        working-directory: src/Web/Sextante.Web
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  format:
    name: Format check (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET solution
        run: dotnet restore Sextante.slnx

      - name: dotnet format --verify-no-changes
        run: dotnet format Sextante.slnx --verify-no-changes --no-restore
